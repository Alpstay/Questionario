<style>

/* Layout: tavolo da lavoro a due colonne. Sinistra = dati della committenza, destra = verdetto sempre visibile (sticky). */
:root {
  --bg: #e9edef;          /* pietra dolomitica fredda */
  --surface: #ffffff;
  --surface-2: #f3f5f6;
  --ink: #172026;
  --ink-2: #56636c;
  --line: #d3d9dd;
  --accent: #1d5c52;      /* abete */
  --accent-soft: #dcebe6;
  --ok: #287a4a;
  --res: #6c7a1f;
  --warn: #a4640a;
  --crit: #b23f2b;
  --stop: #8a1c1c;
  --info: #336a98;
  --on-strong: #ffffff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161a; --surface: #182025; --surface-2: #1e272d; --ink: #e3e9ec; --ink-2: #98a6af; --line: #2d383f;
    --accent: #62b5a4; --accent-soft: #1b3531; --ok: #5cc486; --res: #b9c75a; --warn: #e3a64a; --crit: #f0806a;
    --stop: #ff6b6b; --info: #7fb2e0; --on-strong: #10161a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161a; --surface: #182025; --surface-2: #1e272d; --ink: #e3e9ec; --ink-2: #98a6af; --line: #2d383f;
  --accent: #62b5a4; --accent-soft: #1b3531; --ok: #5cc486; --res: #b9c75a; --warn: #e3a64a; --crit: #f0806a;
  --stop: #ff6b6b; --info: #7fb2e0; --on-strong: #10161a; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


.app-fatt {
  .bridge { display: grid; gap: 6px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }
  .bridge .l { font-size: .8rem; font-weight: 500; }
  .bridge-r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bridge .hint.ok { color: var(--ok); } .bridge .hint.warn { color: var(--warn); }
  .sec-derived { background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }
  .dvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 16px; }
  .dv { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding: 5px 0; font-size: .88rem; min-width: 0; }
  .dv-l { color: var(--ink-2); } .dv b { font-family: var(--f-mono); font-weight: 500; white-space: nowrap; }
  .bridge a.btn { text-decoration: none; font-size: .82rem; padding: 5px 10px; }
  .sec-cfg h3 { font-size: 1.1rem; margin-top: 6px; }
  .segc { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
  .segb { position: relative; padding: 6px 12px; cursor: pointer; font-size: .84rem; color: var(--ink-2); }
  .segb + .segb { border-left: 1px solid var(--line); }
  .segb input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .segb.on { background: var(--accent); color: var(--on-strong); }
  .segb:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Testata */
.top { max-width: 1320px; margin: 0 auto; padding-block: 20px 14px; display: grid; gap: 14px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; }
.brand h1 { font-size: 2.1rem; line-height: 1; }
.brand .kicker { display: block; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-strong); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; }
.btn.armed { background: var(--crit); border-color: var(--crit); color: var(--on-strong); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-family: var(--f-mono); font-size: .8rem; letter-spacing: .06em; color: var(--ink-2); }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-strong); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.meta label { display: grid; gap: 4px; font-size: .74rem; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.meta input { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-family: var(--f-body); font-size: .95rem; text-transform: none; letter-spacing: 0; color: var(--ink); min-width: 0; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: var(--r); padding: 10px 14px; }
.banner p { margin: 0; flex: 1 1 260px; }

/* Striscia riassuntiva (solo schermi stretti) */
.strip { display: none; }

/* Griglia principale */
.work { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 460px); gap: 24px; align-items: start; }
#form { display: grid; gap: 16px; min-width: 0; }
#results { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; display: grid; gap: 12px; min-width: 0; padding-bottom: 12px; scrollbar-width: thin; }

/* Sezioni del questionario */
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.sec-h { display: flex; gap: 14px; align-items: flex-start; }
.sec-n { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1; color: var(--accent); min-width: 1.4ch; padding-top: 2px; }
.sec h2 { font-size: 1.45rem; line-height: 1.1; }
.lead { margin: 4px 0 0; color: var(--ink-2); max-width: 65ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 18px; }
.fld { display: grid; gap: 5px; align-content: start; min-width: 0; }
.fld > label, .lblrow label { font-weight: 500; }
.lblrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.opt { font-weight: 400; color: var(--ink-2); font-size: .8rem; }
.unk { display: inline-flex; gap: 5px; align-items: center; font-size: .78rem; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.ctl { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); overflow: hidden; }
.ctl:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ctl input, .ctl select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 10px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .95rem; outline: none; }
.ctl select { font-family: var(--f-body); cursor: pointer; }
.unit { display: flex; align-items: center; padding: 0 10px; font-size: .78rem; color: var(--ink-2); border-left: 1px solid var(--line); white-space: nowrap; font-family: var(--f-mono); }
.hint { margin: 0; font-size: .8rem; color: var(--ink-2); }
.fld.is-unknown .ctl { opacity: .5; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px); }
.fld.has-err .ctl { border-color: var(--crit); box-shadow: 0 0 0 2px color-mix(in srgb, var(--crit) 20%, transparent); }
.fld-bool { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; cursor: pointer; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.fld-bool input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.fld-bool .hint { grid-column: 2; }
.sumline { margin: 0; font-family: var(--f-mono); font-size: .82rem; }
.sumline.good { color: var(--ok); }
.sumline.bad { color: var(--crit); font-weight: 500; }

/* Housekeeping */
.hk-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hk-g { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); padding-top: 10px; }
.hk-i { display: flex; gap: 12px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; background: var(--surface-2); }
.hk-chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; min-width: 0; flex: 1; }
.hk-chk input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.hk-chk span { display: grid; gap: 2px; min-width: 0; }
.hk-chk b { font-weight: 500; }
.hk-chk small { color: var(--ink-2); font-size: .8rem; }
.ctl-sm { flex: 0 0 104px; background: var(--surface); }

/* Soglie */
.sec-cfg summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; }
.sec-cfg summary::-webkit-details-marker { display: none; }
.sec-cfg summary::before { content: "+"; font-family: var(--f-mono); color: var(--accent); width: 1.4ch; }
.sec-cfg[open] summary::before { content: "−"; }
.sec-cfg h2 { font-size: 1.25rem; }
.tag { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
.sec-cfg .btn { justify-self: start; }

/* Risultati */
.verdict { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-left-width: 6px; }
.verdict p { margin: 0; color: var(--ink-2); }
.v-k { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.v-l { font-family: var(--f-display); font-size: 2rem; line-height: 1; font-weight: 700; }
.v-c { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--ink-2); padding-top: 4px; }
.v-c b { color: var(--ink); font-variant-numeric: tabular-nums; }
.v-ok { border-left-color: var(--ok); } .v-ok .v-l { color: var(--ok); }
.v-res { border-left-color: var(--res); } .v-res .v-l { color: var(--res); }
.v-rev { border-left-color: var(--warn); } .v-rev .v-l { color: var(--warn); }
.v-no, .v-bp { border-left-color: var(--stop); } .v-no .v-l, .v-bp .v-l { color: var(--stop); }
.v-inc { border-left-color: var(--ink-2); }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; align-content: start; position: relative; }
.kpi::after { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: transparent; }
.kpi.k-ok::after { background: var(--ok); } .kpi.k-rev::after { background: var(--warn); } .kpi.k-no::after { background: var(--stop); }
.kpi-l { font-size: .74rem; color: var(--ink-2); font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .05em; }
.kpi-v { font-family: var(--f-display); font-weight: 700; font-size: 1.85rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi.k-no .kpi-v { color: var(--stop); } .kpi.k-rev .kpi-v { color: var(--warn); }
.kpi-s { font-size: .8rem; color: var(--ink-2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card h3 { font-size: 1.15rem; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fx-t { font-size: .8rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.pill { display: inline-block; font-family: var(--f-mono); font-size: .7rem; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.pill-stopp, .pill-no, .pill-bp { background: var(--stop); border-color: var(--stop); color: var(--on-strong); }
.pill-kritisch { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.pill-warnung, .pill-rev { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.pill-info { color: var(--info); background: color-mix(in srgb, var(--info) 10%, transparent); }
.pill-ok { background: var(--ok); border-color: var(--ok); color: var(--on-strong); }
.pill-res { color: var(--res); background: color-mix(in srgb, var(--res) 12%, transparent); }
.pill-inc { color: var(--ink-2); }

.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flag { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 10px 10px 10px 12px; border-radius: var(--r); background: var(--surface-2); border-left: 3px solid var(--line); }
.flag p { margin: 0; }
.flag .pill { align-self: start; }
.flag .jump { grid-column: 2; justify-self: start; }
.sev-stopp { border-left-color: var(--stop); } .sev-kritisch { border-left-color: var(--crit); }
.sev-warnung { border-left-color: var(--warn); } .sev-info { border-left-color: var(--info); }
.jump { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; }
.none { margin: 0; color: var(--ok); }
.miss { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

.meter { display: grid; gap: 6px; }
.m-track { position: relative; height: 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; }
.m-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px 0 0 2px; }
.m-fill.k-ok, .sw.k-ok { background: var(--ok); } .m-fill.k-rev, .sw.k-rev { background: var(--warn); } .m-fill.k-no, .sw.k-no { background: var(--stop); }
.m-mark { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 1px; }
.m-scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .72rem; color: var(--ink-2); }
.m-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.sw-mark { background: var(--ink); width: 3px; }
.sw-min { width: 0; height: 12px; border-left: 2px dashed var(--stop); border-radius: 0; }

.bars { display: grid; gap: 10px; }
.b-row { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: 10px; align-items: center; }
.b-l { font-size: .82rem; color: var(--ink-2); }
.b-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 2px; }
.b-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.b-budget { background: var(--ink-2); }
.b-fill.k-ok { background: var(--ok); } .b-fill.k-rev { background: var(--warn); } .b-fill.k-no { background: var(--stop); }
.b-min { position: absolute; top: -4px; bottom: -4px; border-left: 2px dashed var(--stop); }
.b-v { font-family: var(--f-mono); font-size: .82rem; font-variant-numeric: tabular-nums; min-width: 6.5rem; text-align: right; }
.b-note { margin: 0; font-size: .8rem; color: var(--ink-2); }

.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th, td { text-align: left; padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
th { font-weight: 400; }
.tg-h { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); padding-top: 14px; border-bottom: 1px solid var(--ink-2); }
.fx { display: none; font-family: var(--f-mono); font-size: .74rem; color: var(--ink-2); margin-top: 2px; }
&.show-fx .fx { display: block; }

.yn { margin: 0; display: grid; gap: 8px; }
.yn div { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.yn dt { color: var(--ink-2); }
.yn dd { margin: 0; text-align: right; }
.n-l { font-weight: 500; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); padding: 8px 10px; resize: vertical; }
#copy-fallback { font-family: var(--f-mono); font-size: .8rem; }

@media (max-width: 1000px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  #results { position: static; max-height: none; overflow: visible; }
  .strip { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 0 -16px 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: .85rem; cursor: pointer; }
  .strip b { font-variant-numeric: tabular-nums; }
}
@media (max-width: 480px) {
  .brand h1 { font-size: 1.75rem; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .hk-i { flex-wrap: wrap; }
  .ctl-sm { flex-basis: 100%; }
  .b-row { grid-template-columns: 1fr auto; }
  .b-l { grid-column: 1 / -1; }
  .b-track { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

  .row { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface-2); display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
  .row-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ctl-sel { flex: 0 0 auto; background: var(--surface); }
  .ctl-sel select { border: 0; background: transparent; padding: 7px 8px; font-family: var(--f-body); font-size: .9rem; cursor: pointer; outline: none; color: var(--ink); }
  .row-name { flex: 1 1 160px; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 4px 0; font-family: var(--f-display); font-size: 1.25rem; font-weight: 600; outline: none; }
  .row-name:focus { border-bottom-color: var(--accent); }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .row-r { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; font-size: .84rem; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 8px; }
  .row-r b { color: var(--ink); font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; margin-left: auto; }
  .meter { display: grid; gap: 6px; }
  .m-track { position: relative; height: 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; }
  .m-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px 0 0 2px; }
  .m-fill.k-ok { background: var(--ok); } .m-fill.k-rev { background: var(--warn); } .m-fill.k-no { background: var(--stop); }
  .m-mark { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; background: var(--stop); border-radius: 1px; }
  .m-mark.m-warn { background: var(--warn); width: 2px; }
  .m-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--ink-2); }
  .m-legend b { color: var(--ink); }
  .stack { display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 8px; }
  .st { background: var(--accent); opacity: .95; min-width: 2px; }
  .st:nth-child(2n) { opacity: .7; } .st:nth-child(3n) { opacity: .5; } .st:nth-child(4n) { opacity: .35; }
  .dl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .84rem; }
  .dl li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 2px 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .dl em { font-style: normal; font-family: var(--f-mono); color: var(--ink-2); font-size: .78rem; }
  .dl b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .dl small { grid-column: 2 / -1; color: var(--ink-2); font-size: .76rem; }
  .dl .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); display: inline-block; }
  .dl li:nth-child(2n) .sw { opacity: .7; } .dl li:nth-child(3n) .sw { opacity: .5; } .dl li:nth-child(4n) .sw { opacity: .35; }
  .verdict.v-inc { border-left-color: var(--ink-2); }
}

.app-rb {
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
  .lang button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-family: var(--f-mono); font-size: .8rem; letter-spacing: .06em; color: var(--ink-2); }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-strong); }
  .meta { display: grid; grid-template-columns: minmax(0, 320px); }
  .meta-2 { grid-template-columns: minmax(0, 320px) auto; gap: 14px; align-items: end; }
  .catsel { display: grid; gap: 4px; font-size: .74rem; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  .catsel .segb { padding: 7px 12px; font-size: .85rem; font-family: var(--f-body); letter-spacing: 0; text-transform: none; }
  .catsel .segb.on { background: var(--accent); }
  .src { margin: 0; max-width: 80ch; }
  .pill-lv { font-size: .62rem; margin-left: 4px; vertical-align: 1px; }
  .pill-lv.lv-M { color: var(--crit); background: color-mix(in srgb, var(--crit) 10%, transparent); }
  .pill-lv.lv-P { color: var(--accent); }
  .pill-lv.lv-D { color: var(--ink-2); }
  .rb-i.lv-M { background: color-mix(in srgb, var(--crit) 4%, var(--surface-2)); }
  .rb-i.conflict { border-color: var(--stop); border-left-color: var(--stop); opacity: 1; }
  .rb-t .conf { color: var(--stop); font-weight: 500; }
  .card-conf { border-left: 4px solid var(--stop); }
  .mrow { font-size: .84rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .pill-inc { color: var(--ink-2); }
  .apt-f a { color: var(--stop); }
  @media (max-width: 600px) { .meta-2 { grid-template-columns: minmax(0, 1fr); } }
  .meta label { display: grid; gap: 4px; font-size: .74rem; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  .meta input { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-family: var(--f-body); font-size: .95rem; text-transform: none; letter-spacing: 0; color: var(--ink); min-width: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chipf { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .84rem; color: var(--ink-2); }
  .chipf.on { background: var(--accent); border-color: var(--accent); color: var(--on-strong); }
  .sec h2 { font-size: 1.3rem; }
  .sec-n { color: var(--accent); font-weight: 700; }
  .sec-p { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-2); }
  .rb-list { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
  .rb-i { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--surface-2); min-width: 0; }
  .rb-t { grid-column: 1 / -1; }
  .rb-i .segc { grid-column: 2; grid-row: 2; }
  .rb-i .rb-n { grid-column: 1; grid-row: 2; }
  .rb-i.st-yes { border-left-color: var(--accent); } .rb-i.st-ok { border-left-color: var(--ok); } .rb-i.st-no { border-left-color: var(--ink-2); opacity: .75; }
  .rb-t { display: grid; gap: 2px; min-width: 0; }
  .rb-t b { font-weight: 500; } .rb-t small { color: var(--ink-2); font-size: .8rem; }
  .pill-add { color: var(--warn); font-size: .62rem; margin-left: 4px; vertical-align: 1px; }
  .segc { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); justify-self: end; }
  .segb { position: relative; padding: 5px 9px; cursor: pointer; font-size: .78rem; color: var(--ink-2); white-space: nowrap; }
  .segb + .segb { border-left: 1px solid var(--line); }
  .segb input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .segb.on { background: var(--ink-2); color: var(--on-strong); }
  .segb.st-yes.on { background: var(--accent); } .segb.st-ok.on { background: var(--ok); } .segb.st-no.on { background: var(--ink-2); }
  .segb:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rb-n { border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 3px 0; font-size: .84rem; outline: none; min-width: 0; }
  .rb-n:focus { border-bottom-color: var(--accent); }
  .pbar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .pbar > div { height: 100%; background: var(--accent); }
  .pbar.big { height: 12px; margin-top: 6px; }
  .secs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .secs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; font-size: .84rem; }
  .secs a { color: var(--ink); text-decoration: none; font-weight: 500; } .secs a:hover { color: var(--accent); }
  .secs a { grid-column: 1; grid-row: 1; } .secs .pbar { grid-column: 1; grid-row: 2; } .secs em { font-style: normal; font-family: var(--f-mono); color: var(--ink-2); font-size: .78rem; grid-column: 2; grid-row: 1 / 3; align-self: center; }
  .verdict.v-inc { border-left-color: var(--ink-2); }
  #sec-areas h3 { font-size: 1.05rem; margin-top: 4px; }
  #sec-areas .grid { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .ulist { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
  .uhead, .urow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(110px, .8fr) minmax(120px, .9fr) auto; gap: 8px; align-items: center; }
  .uhead { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); padding: 0 2px; }
  .uname { min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 6px 0; font-weight: 500; outline: none; }
  .uname:focus { border-bottom-color: var(--accent); }
  .btn-del { font-size: .78rem; padding: 6px 10px; color: var(--ink-2); }
  #u-add { justify-self: start; }
  .kpis-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card-areas h4 { margin: 6px 0 0; font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
  .stack { display: flex; height: 14px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 4px; }
  .st { min-width: 2px; } .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .m-units { background: var(--accent); } .m-common { background: var(--info); } .m-service { background: var(--warn); } .m-park { background: var(--ink-2); } .m-resid { background: var(--line); }
  .dl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .84rem; }
  .dl li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 2px 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .dl em { font-style: normal; font-family: var(--f-mono); color: var(--ink-2); font-size: .76rem; }
  .dl b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .dl small { grid-column: 2 / -1; color: var(--ink-2); font-size: .76rem; }
  .flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .flag { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 8px 10px; border-radius: var(--r); background: var(--surface-2); border-left: 3px solid var(--line); font-size: .86rem; }
  .flag p { margin: 0; } .flag .pill { align-self: start; }
  .sev-stopp { border-left-color: var(--stop); } .sev-kritisch { border-left-color: var(--crit); } .sev-warnung { border-left-color: var(--warn); } .sev-info { border-left-color: var(--info); }
  .pill-stopp { background: var(--stop); border-color: var(--stop); color: var(--on-strong); } .pill-kritisch { color: var(--crit); } .pill-warnung { color: var(--warn); } .pill-info { color: var(--info); }
  .tbl { overflow-x: auto; } .card-areas table { font-size: .8rem; } .card-areas th, .card-areas td { text-align: right; padding: 5px 4px; white-space: nowrap; } .card-areas th[scope="row"], .card-areas thead th:first-child { text-align: left; white-space: normal; font-weight: 500; }
  .card-areas thead th { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); font-weight: 400; }
  .ctab th, .ctab td { text-align: right; padding: 4px 4px; font-size: .8rem; white-space: nowrap; }
  .ctab th[scope="row"] { text-align: left; white-space: normal; font-weight: 500; }
  .ctab th[scope="row"] small { display: block; font-family: var(--f-mono); font-weight: 400; color: var(--ink-2); font-size: .7rem; }
  .ctab thead th { font-family: var(--f-mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); font-weight: 400; }
  .ctab td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .ctab .ctl-sm { width: 92px; flex: none; } .ctab .ctl-sm input { padding: 4px 6px; font-size: .8rem; text-align: right; }
  .ctab tr.sub th, .ctab tr.sub td { color: var(--ink-2); border-top: 1px solid var(--line); }
  .ctab tr.open th, .ctab tr.open td { color: var(--ink-2); font-style: italic; }
  .ctab tr.tot th, .ctab tr.tot td { font-weight: 600; color: var(--ink); border-top: 2px solid var(--ink-2); }
  .cost-v { font-size: 1.35rem; }
  #sec-costs summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; }
  #sec-costs summary::-webkit-details-marker { display: none; }
  #sec-costs summary::before { content: "+"; font-family: var(--f-mono); color: var(--accent); width: 1.4ch; }
  #sec-costs[open] summary::before { content: "−"; }
  #sec-costs h2 { font-size: 1.25rem; }
  #sec-costs .btn { justify-self: start; }
  @media (max-width: 600px) { .uhead { display: none; } .urow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .urow .uname { grid-column: 1 / -1; } .kpis-3 { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { .rb-i { grid-template-columns: minmax(0, 1fr); } .rb-i .segc { grid-column: 1; grid-row: 2; justify-self: start; } .rb-i .rb-n { grid-column: 1; grid-row: 3; } }
}


/* Contenitore: menu laterale fisso a sinistra, strumento a destra. Sotto i 800px il menu diventa una barra in alto. */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.print-only .topbar { display: none; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; }
.side-b { padding: 0 8px; }
.side-logo { width: 64px; color: var(--ink); margin-bottom: 6px; }
.side-b .k { display: block; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.side-b b { display: block; font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; line-height: 1; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: grid; gap: 0; padding: 6px 10px; font-size: .92rem; line-height: 1.25; border-radius: var(--r); text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); border-left-color: var(--accent); }
.nav .n-l { font-weight: 500; }
.nav .n-s { font-size: .68rem; color: var(--ink-2); font-family: var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-f { margin-top: auto; padding: 0 8px; font-size: .72rem; line-height: 1.35; color: var(--ink-2); }
/* schermi bassi: menu senza sottotitoli e senza nota, per evitare lo scroll del menu */
@media (min-width: 801px) and (max-height: 860px) { .nav .n-s, #side-note { display: none; } .side-b .k2 { display: none; } .side { gap: 10px; } }
.mainwrap { min-width: 0; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 96px 8px 16px; pointer-events: auto; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
/* gli interruttori lingua locali degli strumenti sono sostituiti da quello globale in alto a destra */
.main #lang { display: none !important; }
.top-proj { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.top-proj b { color: var(--ink); font-weight: 600; }
.glang { display: inline-flex; flex: none; margin: 0; align-self: flex-start; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.glang button { border: 0; background: transparent; padding: 8px 16px; min-width: 48px; cursor: pointer; font-family: var(--f-mono); font-size: .8rem; letter-spacing: .06em; color: var(--ink-2); }
.glang button + button { border-left: 1px solid var(--line); }
.glang button[aria-pressed="true"] { background: var(--accent); color: var(--on-strong); }
[hidden] { display: none !important; }
/* nelle testate degli strumenti resta solo "Carica esempio": copia e nuovo calcolo sono nella panoramica/archivio */
.main .actions #btn-copy, .main .actions #btn-new, .main #copy-fallback { display: none !important; }
.banner-rb { background: color-mix(in srgb, var(--info) 12%, var(--surface)); border-color: color-mix(in srgb, var(--info) 40%, var(--line)); }
.banner-rb a.btn { text-decoration: none; }
.main input[readonly] { background: var(--surface-2); color: var(--ink-2); cursor: not-allowed; }
/* pulsanti "i" e finestrella informativa */
.ibtn { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; margin-left: 6px; padding: 0; border-radius: 50%; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: .72rem; line-height: 1; cursor: pointer; vertical-align: middle; }
.ibtn:hover, .ibtn:focus-visible { background: var(--accent); color: var(--on-strong); outline: none; }
.ctl-sel .ibtn, .filters .ibtn { margin-left: 8px; }
.ipop { position: fixed; z-index: 1000; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 12px 34px 12px 14px; font-size: .84rem; line-height: 1.45; }
.ipop h4 { margin: 0 0 3px; font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.ipop p { margin: 0 0 10px; } .ipop p:last-child { margin-bottom: 0; }
.ipop-x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); font-size: 1.1rem; cursor: pointer; }
.ipop-x:hover { background: var(--surface-2); }
/* archivio progetti */
.app-arch .sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-top: 16px; }
.app-arch .sec h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 1.4rem; }
.app-arch .lead { margin: 0 0 8px; font-size: .84rem; color: var(--ink-2); }
.app-arch .fld label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: 4px; }
.app-arch .fld input { width: 100%; max-width: 480px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; }
.app-arch .none { color: var(--ink-2); }
.app-arch .hint.ok { color: var(--ok); font-weight: 500; }
.app-arch .btn-ghost { background: transparent; }
.app-arch .btn-del { color: var(--crit); }
.app-arch .alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.app-arch .arow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }

rchschnitt \xFCber die gesamte \xD6ffnungszeit inkl. Nebensaison. Volle Wochen sind kein Durchschnitt."),"f:targetRevenue":K("Fatturato netto annuo dell'intero hotel: alloggio, ristorazione, wellness e servizi extra.","IVA esclusa. Da qui si ricava tutto: se il numero \xE8 un desiderio, tutta la fattibilit\xE0 \xE8 un desiderio.","Netto-Jahresumsatz des gesamten Hauses: Logis, F&B, Wellness, Zusatzleistungen.","Ohne MwSt. Alles leitet sich hieraus ab: ist die Zahl ein Wunsch, ist die ganze Machbarkeit ein Wunsch."),"f:shareRooms":K("Quota del fatturato che viene dall'alloggio.","Le tre quote (alloggio, F&B, spa) devono sommare 100 %. Nell'hotel alpino a mezza pensione l'alloggio pesa di solito 60\u201370 %.","Anteil des Umsatzes aus Logis.","Die drei Anteile m\xFCssen 100 % ergeben. Im alpinen Halbpensionshotel liegt Logis meist bei 60\u201370 %."),"f:shareFb":K("Quota del fatturato da ristorante, bar e colazioni.","Con la mezza pensione inclusa nel prezzo, separa la quota vitto con un criterio stabile e usalo sempre.","Umsatzanteil aus Restaurant, Bar, Fr\xFChst\xFCck.","Bei Halbpension im Preis den Verpflegungsanteil nach einem festen Schl\xFCssel trennen und dabei bleiben."),"f:shareSpa":K("Quota del fatturato da trattamenti, wellness a pagamento e servizi extra.","Non contare qui la spa inclusa nel prezzo camera: quel valore \xE8 dentro l'ADR.","Umsatzanteil aus Behandlungen, kostenpflichtigem Wellness und Extras.","Im Zimmerpreis enthaltene Spa-Nutzung nicht hier z\xE4hlen: sie steckt im ADR."),"f:avgGuestsPerRoom":K("Ospiti medi per camera occupata (indice di doppia occupazione).","Serve per letti, coperti e biancheria. Nel turismo vacanza 1,8\u20132,2; con molte famiglie pu\xF2 superare 2,5.","Durchschnittliche G\xE4ste je belegtem Zimmer (Doppelbelegung).","F\xFCr Betten, Gedecke und W\xE4sche. In der Ferienhotellerie 1,8\u20132,2; mit vielen Familien \xFCber 2,5."),"f:plannedRooms":K("Numero di camere (o unit\xE0) che il progetto prevede davvero: dal Raumbuch se compilato, altrimenti dal disegno.","Con questo numero l'app calcola in avanti il fatturato possibile (camere \xD7 giorni \xD7 occupazione \xD7 ADR) e lo confronta con l'obiettivo. Se il Raumbuch \xE8 compilato il campo \xE8 bloccato: si corregge l\xEC.","Zahl der Zimmer (oder Einheiten), die der Entwurf wirklich vorsieht: aus dem Raumbuch, sonst aus dem Entwurf.","Damit rechnet die App vorw\xE4rts den m\xF6glichen Umsatz (Zimmer \xD7 Tage \xD7 Auslastung \xD7 ADR) und vergleicht ihn mit dem Ziel. Ist das Raumbuch ausgef\xFCllt, ist das Feld gesperrt: dort korrigieren."),"f:potential":K("Il fatturato che le camere previste possono generare: notti camera vendute \xD7 ADR per l'alloggio, poi il totale secondo il mix di ricavi (quota alloggio).","\xC8 un tetto, non una previsione: presuppone che occupazione e ADR dichiarati si realizzino. Se \xE8 sotto l'obiettivo di oltre il 10 %, l'obiettivo va abbassato o il progetto ingrandito; se \xE8 molto sopra, l'obiettivo \xE8 prudente o l'edificio \xE8 troppo grande.","Der Umsatz, den die geplanten Zimmer erl\xF6sen k\xF6nnen: verkaufte Zimmern\xE4chte \xD7 ADR f\xFCr die Logis, dann das Ganze \xFCber den Umsatzmix (Logisanteil).","Eine Obergrenze, keine Prognose: setzt voraus, dass Auslastung und ADR eintreten. Liegt sie mehr als 10 % unter dem Ziel, ist das Ziel zu senken oder das Haus zu vergr\xF6\xDFern; liegt sie weit dar\xFCber, ist das Ziel konservativ oder das Haus zu gro\xDF."),"f:breakevenBedsStated":K("Quanti letti occupati al giorno servono, secondo il committente, per coprire i costi fissi.",`\xC8 la sua stima, non un dato: l'app la confronta con il calcolo. Se non lo sa, spunta "Non so": \xE8 un'informazione importante.`,"Wie viele belegte Betten pro Tag laut Bauherr die Fixkosten decken.",'Seine Sch\xE4tzung, kein Wert: die App vergleicht sie mit der Rechnung. Wei\xDF er es nicht, "Wei\xDF ich nicht" ankreuzen: das ist eine wichtige Information.'),"f:fixedCostsYear":K("Costi che restano anche a hotel vuoto: personale fisso, energia di base, assicurazioni, manutenzione, interessi o affitto.","Includi il costo del personale importato dal calcolatore. Escludi ammortamenti e costi variabili per ospite.","Kosten, die auch bei leerem Haus bleiben: Stammpersonal, Grundlast Energie, Versicherungen, Instandhaltung, Zins oder Pacht.","Personalkosten aus dem Rechner einschlie\xDFen. Abschreibungen und variable Kosten je Gast ausschlie\xDFen."),"f:variableCostRatio":K("Costi che crescono con gli ospiti, in percentuale del fatturato: merci, personale extra, commissioni, lavanderia, consumi.","In hotel 25\u201335 %. Sotto il 20 % \xE8 quasi sempre un errore di classificazione dei costi.","Kosten, die mit den G\xE4sten wachsen, in % des Umsatzes: Wareneinsatz, Aushilfen, Provisionen, W\xE4sche, Verbrauch.","Im Hotel 25\u201335 %. Unter 20 % ist fast immer ein Zuordnungsfehler."),"f:totalBudget":K("Investimento totale: costruzione, arredi, spese tecniche e terreno.","Deriva dalla stima costi del Raumbuch pi\xF9 il terreno. Scegli minimo, media o massimo con il selettore.","Gesamtinvestition: Bau, Einrichtung, Nebenkosten und Grundst\xFCck.","Abgeleitet aus der Kostensch\xE4tzung des Raumbuchs plus Grundst\xFCck. Minimum, Mittel oder Maximum w\xE4hlen."),"f:landCost":K("Costo del terreno, compresi oneri di acquisto e urbanizzazione.","Se il terreno \xE8 gi\xE0 di propriet\xE0 inserisci comunque il suo valore: il capitale immobilizzato pesa sul rendimento.","Grundst\xFCckskosten inkl. Erwerbsnebenkosten und Erschlie\xDFung.","Auch bei Eigenbesitz den Wert eintragen: gebundenes Kapital belastet die Rendite."),"f:targetGopMargin":K("Margine operativo lordo atteso, prima dei costi di propriet\xE0, interessi e ammortamenti.","Hotel alpini ben gestiti: 30\u201340 %. Oltre il 45 % \xE8 una promessa da dimostrare.","Erwartete GOP-Marge vor Eigent\xFCmerkosten, Zinsen, Abschreibung.","Gut gef\xFChrte Alpenhotels: 30\u201340 %. \xDCber 45 % ist ein Versprechen, das belegt werden muss."),"f:ownerCostsPct":K("Costi di propriet\xE0 in percentuale del fatturato: fondo FF&E, imposte sull'immobile, assicurazione del fabbricato.","Tipico 5\u20138 %. Non includere gli interessi del finanziamento.","Eigent\xFCmerkosten in % des Umsatzes: FF&E-Reserve, Immobiliensteuer, Geb\xE4udeversicherung.","Typisch 5\u20138 %. Zinsen nicht einrechnen."),"f:targetYield":K("Rendimento iniziale atteso sull'investimento totale (EBITDA diviso investimento).","Determina quanto edificio il reddito pu\xF2 sostenere. 6\u20138 % per un hotel di propriet\xE0; sotto il 5 % la banca non segue.","Erwartete Anfangsrendite auf die Gesamtinvestition (EBITDA \xF7 Investition).","Bestimmt, wie viel Geb\xE4ude der Ertrag tr\xE4gt. 6\u20138 % bei Eigenbetrieb; unter 5 % steigt keine Bank ein."),"f:suiteShare":K("Quota di camere classificate come suite.",'Derivata dal Raumbuch: categorie chiamate "suite" o da 45 m\xB2 in su.',"Anteil der Zimmer, die als Suiten gelten.",'Aus dem Raumbuch: Kategorien mit "Suite" im Namen oder ab 45 m\xB2.'),"f:spaM2":K("Superficie totale dell'area wellness.","Dal bilancio delle superfici. Oltre 12 m\xB2 per camera scatta un avviso di sovradimensionamento.","Gesamtfl\xE4che des Wellnessbereichs.","Aus der Fl\xE4chenbilanz. \xDCber 12 m\xB2 je Zimmer folgt eine Warnung."),"f:extraAreasM2":K("Superfici accessorie: seminari, kids club, spazi affittati a terzi.","Dal bilancio delle superfici. Vanno confrontate con il ricavo che producono.","Zusatzfl\xE4chen: Seminar, Kids Club, Fremdvermietung.","Aus der Fl\xE4chenbilanz. Mit dem erzielten Umsatz vergleichen."),"f:extraAreasRevenue":K("Ricavo annuo prodotto dalle superfici accessorie.","Se non lo conosci lascia 0: l'avviso ti ricorder\xE0 che quelle superfici oggi costano e non rendono.","Jahresumsatz aus den Zusatzfl\xE4chen.","Unbekannt: 0 lassen; die Warnung erinnert daran, dass diese Fl\xE4chen kosten und nichts bringen."),"f:fbCaptureRate":K("Quota degli ospiti in casa che cenano al ristorante.","Mezza pensione: 90\u2013100 %. Garni o solo colazione: 0 per la cena.","Anteil der Hausg\xE4ste, die im Restaurant zu Abend essen.","Halbpension: 90\u2013100 %. Garni: 0 f\xFCr das Abendessen."),"f:seatTurns":K("Quante volte un posto viene occupato in un servizio serale.","1 = un turno. Con due turni si dimezzano i posti necessari ma cala il comfort.","Wie oft ein Platz je Abendservice belegt wird.","1 = eine Sitzung. Zwei Sitzungen halbieren die Pl\xE4tze, senken aber den Komfort."),"f:externalGuests":K("Il ristorante serve anche clienti non alloggiati.","Richiede un ingresso separato e posti aggiuntivi: indicali nel campo accanto.","Das Restaurant bedient auch externe G\xE4ste.","Braucht separaten Eingang und zus\xE4tzliche Pl\xE4tze: im Feld daneben angeben."),"f:externalSeats":K("Posti riservati ai clienti esterni.","Solo se gli esterni sono previsti. Aumentano posti, cucina e coperti.","Pl\xE4tze f\xFCr externe G\xE4ste.","Nur wenn Externe vorgesehen sind. Erh\xF6ht Pl\xE4tze, K\xFCche und Gedecke."),"f:fteFull":K("Personale a tempo pieno equivalente a pieno regime.","Importato dal calcolatore del personale. Le stagionali a 8 mesi valgono 0,67 FTE.","Vollzeit\xE4quivalente bei Vollbetrieb.","Aus dem Personalkosten-Rechner. Saisonkr\xE4fte mit 8 Monaten z\xE4hlen 0,67 FTE."),"f:costPerFte":K("Costo azienda medio per FTE e anno.","Calcolato dal costo totale diviso gli FTE: include contributi, mensilit\xE0 aggiuntive, TFR, vitto e alloggio.","Durchschnittliche Vollkosten je FTE und Jahr.","Gesamtkosten \xF7 FTE: inkl. Abgaben, Sonderzahlungen, Abfertigung, Kost und Logis."),"f:grossM2PerKey":K("Superficie lorda di pavimento fuori terra per camera, garage escluso.","Dal bilancio delle superfici. 80\u2013100 m\xB2 per un 4\u2605 alpino con spa; molto di pi\xF9 significa spazi comuni costosi.","Bruttogeschossfl\xE4che oberirdisch je Zimmer, ohne Garage.","Aus der Fl\xE4chenbilanz. 80\u2013100 m\xB2 f\xFCr ein alpines 4\u2605 mit Spa; deutlich mehr hei\xDFt teure Gemeinschaftsfl\xE4chen."),"f:floors":K("Numero di piani con camere.","Dal Raumbuch. Oltre due piani senza office di piano l'housekeeping perde tempo.","Anzahl der Zimmergeschosse.","Aus dem Raumbuch. \xDCber zwei Geschosse ohne Etagenoffice kostet Zeit."),"f:staffHousingInHouse":K("Camere per il personale dentro l'edificio dell'hotel.",`Dallo stato della posizione "Camere per il personale" nella checklist. Ogni camera del personale nell'edificio toglie superficie vendibile.`,"Mitarbeiterzimmer im Hotelgeb\xE4ude.",'Aus dem Status der Position "Mitarbeiterzimmer" in der Checkliste. Jedes Mitarbeiterzimmer im Haus nimmt verkaufbare Fl\xE4che.'),"f:staffBeds":K("Letti per il personale nell'edificio.","Se gli alloggi sono nell'edificio, l'app assume tante persone quante nel calcolatore del personale.","Mitarbeiterbetten im Geb\xE4ude.","Bei Unterbringung im Haus nimmt die App so viele Personen wie im Personalkosten-Rechner an."),"f:floorOffices":K("Office con biancheria, prodotti e carrelli su ogni piano camere.","Dalla checklist. Senza, ogni camera costa minuti di corridoio.","Etagenoffice mit W\xE4sche, Putzmitteln und Wagen auf jedem Geschoss.","Aus der Checkliste. Ohne kostet jedes Zimmer Minuten im Flur."),"f:guestServiceCrossing":K("Consegne, rifiuti o cucina attraversano percorsi degli ospiti.",`Derivato dalla posizione "Separazione percorsi": se \xE8 esclusa, l'incrocio esiste ed \xE8 bloccante.`,"Anlieferung, M\xFCll oder K\xFCche kreuzen G\xE4stewege.",'Aus der Position "Trennung der Wege": ist sie ausgeschlossen, besteht die Kreuzung und blockiert.'),"f:selfCheckin":K("Totem o app per il check-in autonomo.","Dalla checklist. Riduce banco e turno notturno, ma dai 4\u2605 non sostituisce la presenza obbligatoria.","Terminals oder App f\xFCr Self-Check-in.","Aus der Checkliste. Spart Tresen und Nachtdienst, ersetzt ab 4\u2605 aber nicht die Pr\xE4senzpflicht."),"f:digitalLocks":K("Serrature con chiave digitale o card.","Dalla checklist. Elimina la consegna chiavi e i giri a vuoto.","Digitale Schlie\xDFanlage mit Mobile Key oder Karte.","Aus der Checkliste. Keine Schl\xFCsselausgabe, keine Leerwege."),"f:energy":K("Sistema di riscaldamento e raffrescamento previsto.",'Derivato dalle posizioni geotermia, pompa di calore e centrale termica del Raumbuch. "Non deciso" genera un avviso: i locali tecnici non si possono dimensionare.',"Vorgesehenes Heiz- und K\xFChlsystem.",'Aus den Positionen Geothermie, W\xE4rmepumpe, Heizraum im Raumbuch. "Offen" l\xF6st eine Warnung aus: Technikr\xE4ume sind nicht dimensionierbar.'),"f:materialStrategy":K("Finiture a bassa manutenzione (pi\xF9 capex) oppure economiche (pi\xF9 manutenzione).",`Derivato dalla posizione "Test dell'housekeeping sulle finiture".`,"Wartungsarme Ausstattung (mehr Capex) oder g\xFCnstig (mehr Instandhaltung).",'Aus der Position "Housekeeping-Test der Ausstattung".'),"f:roomAutomation":K("Regolazione automatica che spegne riscaldamento e luci con finestra aperta o camera vuota.",'Dalla posizione "Supervisione impianti". Vale 10\u201320 % di energia nelle camere.',"Raumsteuerung, die Heizung und Licht bei offenem Fenster oder leerem Zimmer abschaltet.",'Aus der Position "Geb\xE4udeleittechnik". 10\u201320 % Energie in den Zimmern.'),"f:cleaningCriticalSurfaces":K("Vetrate complesse, moquette o superfici difficili da pulire.","Derivato dalla posizione sulle finiture: se esclusa, le superfici critiche restano.","Glasfassaden, Teppiche oder schwer zu reinigende Fl\xE4chen.","Aus der Position zur Ausstattung: ausgeschlossen hei\xDFt, die kritischen Fl\xE4chen bleiben."),"f:cfg":K("Soglie con cui l'app giudica i risultati: costo minimo per camera, FTE per camera, incidenza del personale, margine di pareggio.","Sono valori di partenza per l'area alpina. Tarali sui vostri consuntivi prima di presentare un esito a un committente.","Schwellen, mit denen die App die Ergebnisse bewertet.","Startwerte f\xFCr den Alpenraum. Vor einer Pr\xE4sentation beim Bauherrn an den eigenen Zahlen kalibrieren."),"apt:g-cost":K("Costo pieno di un'ora di housekeeping: lordo, contributi, TFR, oppure tariffa oraria della ditta esterna.","Non usare la paga netta. Con ditta esterna usa la tariffa fatturata.","Vollkosten einer Housekeeping-Stunde: Brutto, Abgaben, Abfertigung, oder Stundensatz der Fremdfirma.","Nicht den Nettolohn verwenden. Bei Fremdfirma den verrechneten Satz."),"apt:g-cons":K("Costo di lavanderia e consumabili per ogni cambio, indipendente dal progetto.","Serve al costo reale di un cambio, non al risparmio: le scelte costruttive non lo modificano.","Kosten f\xFCr W\xE4sche und Verbrauchsmaterial je Wechsel, unabh\xE4ngig vom Entwurf.","Dient den echten Kosten eines Wechsels, nicht der Ersparnis: bauliche Entscheidungen \xE4ndern sie nicht."),"apt:g-life":K("Anni di vita utile delle finiture su cui il sovraccosto deve rientrare.","Le finiture a prova di pulizia durano 12\u201315 anni. Oltre, il rientro va rivisto.","Nutzungsdauer der Ausbauten in Jahren, in der sich die Mehrkosten amortisieren m\xFCssen.","Reinigungsfreundliche Ausbauten halten 12\u201315 Jahre. Dar\xFCber ist die Amortisation zu \xFCberdenken."),"apt:name":K("Nome dell'appartamento o della tipologia.","Una riga per unit\xE0 o per gruppo di unit\xE0 identiche.","Name des Apartments oder der Typologie.","Eine Zeile je Einheit oder je Gruppe gleicher Einheiten."),"apt:count":K("Quante unit\xE0 identiche di questa categoria.","Dal Raumbuch se compilato come residence. I totali (risparmio, sovraccosto, ore) si moltiplicano per il numero.","Wie viele gleiche Einheiten dieser Kategorie.","Aus dem Raumbuch, wenn als Residence ausgef\xFCllt. Die Summen (Ersparnis, Mehrkosten, Stunden) werden mit der Anzahl multipliziert."),"apt:m2":K("Superficie dell'appartamento.","Serve solo alla stima dei minuti se non li hai cronometrati.","Fl\xE4che des Apartments.","Dient nur der Minutensch\xE4tzung, wenn nicht gestoppt wurde."),"apt:base":K("Minuti di pulizia al check-out oggi, con finiture standard.",'Il dato cronometrato vale pi\xF9 di ogni stima. "Stima da m\xB2" usa 40 minuti fissi pi\xF9 1 minuto al m\xB2.',"Reinigungsminuten beim Check-out heute, mit Standardausbau.","Der gestoppte Wert z\xE4hlt mehr als jede Sch\xE4tzung. \u201EAus m\xB2 sch\xE4tzen\u201C rechnet 40 Minuten fix plus 1 Minute je m\xB2."),"apt:turnovers":K("Cambi con pulizia completa all'anno.","Tipico 50\u201380 per un appartamento turistico. Con pochi cambi il rientro si allunga molto.","Wechsel mit Komplettreinigung pro Jahr.","Typisch 50\u201380 f\xFCr ein Ferienapartment. Mit wenigen Wechseln verl\xE4ngert sich die Amortisation stark."),"apt:capex":K("Sovraccosto costruttivo per applicare le scelte selezionate.","Vuoto = somma delle voci del catalogo. Sostituiscilo con i preventivi appena li hai.","Bauliche Mehrkosten f\xFCr die gew\xE4hlten Entscheidungen.","Leer = Summe der Katalogpositionen. Sobald Angebote vorliegen, damit ersetzen."),"apt:catalog":K("Minuti risparmiati per ogni scelta costruttiva e relativo sovraccosto.","Sono stime: cronometra in un'unit\xE0 campione e chiedi i preventivi. Sopra il 30\u201335 % di risparmio complessivo la stima \xE8 ottimista.","Gesparte Minuten je bauliche Entscheidung und die zugeh\xF6rigen Mehrkosten.","Sch\xE4tzwerte: in einer Mustereinheit stoppen und Angebote einholen. \xDCber 30\u201335 % Gesamtersparnis ist die Sch\xE4tzung optimistisch."),"hot:g-cost":K("Costo pieno di un'ora di housekeeping.","Lordo, contributi e TFR. Non la paga netta.","Vollkosten einer Housekeeping-Stunde.","Brutto, Abgaben und Abfertigung. Nicht der Nettolohn."),"hot:g-days":K("Giorni di apertura all'anno.","Gli stessi della fattibilit\xE0, altrimenti le pulizie annue non tornano.","\xD6ffnungstage pro Jahr.","Dieselben wie in der Machbarkeit, sonst stimmen die Jahresreinigungen nicht."),"hot:g-shift":K("Ore effettive in camera per addetto e turno, pause e riunioni escluse.","Da un turno di 8 ore restano di solito 6\u20136,5 ore produttive.","Effektive Stunden im Zimmer je Kraft und Schicht, ohne Pausen und Besprechungen.","Von einer 8-Stunden-Schicht bleiben meist 6\u20136,5 produktive Stunden."),"hot:g-ratio":K("Durata della fermata (ripasso giornaliero) rispetto alla partenza.","Di norma 40\u201350 %. Con cambio lenzuola giornaliero sale.","Dauer der Bleibe (t\xE4gliche Zwischenreinigung) im Verh\xE4ltnis zur Abreise.","Normalerweise 40\u201350 %. Mit t\xE4glichem W\xE4schewechsel steigt sie."),"hot:g-fte":K("Addetti alle pulizie attuali, in FTE.","Facoltativo: serve solo a confrontare l'organico con il fabbisogno calcolato.","Aktuelle Reinigungskr\xE4fte in FTE.","Optional: dient nur dem Vergleich des Personalstands mit dem errechneten Bedarf."),"hot:g-linen":K("Costo di lavaggio della biancheria per ospite a ogni partenza.","Lenzuola e asciugamani. Non dipende dal progetto: entra nel costo, non nel risparmio.","Waschkosten der W\xE4sche je Gast bei jeder Abreise.","Bettw\xE4sche und Handt\xFCcher. H\xE4ngt nicht vom Entwurf ab: geht in die Kosten, nicht in die Ersparnis."),"hot:g-linenstay":K("Quota del costo biancheria nelle fermate (solo asciugamani).","0 se non si cambia nulla durante il soggiorno, 100 con cambio completo giornaliero.","Anteil der W\xE4schekosten bei Bleiben (nur Handt\xFCcher).","0, wenn w\xE4hrend des Aufenthalts nichts gewechselt wird, 100 bei t\xE4glichem Komplettwechsel."),"hot:scen":K("Le variabili nascoste: set di cortesia, allestimento letto, software collegato al PMS, tempo morto in corridoio.",'Compila "Situazione attuale" con la realt\xE0 di oggi e "Obiettivo" con il progetto: il risparmio nasce dalla differenza.',"Die versteckten Variablen: Kosmetikset, Bettausstattung, mit dem PMS verbundene Software, Totzeit im Flur.","\u201EAktuelle Situation\u201C mit der heutigen Realit\xE4t ausf\xFCllen, \u201EZiel\u201C mit dem Entwurf: die Ersparnis entsteht aus der Differenz."),"hot:cat-count":K("Camere di questa categoria.","Una riga per tipologia con tempi diversi.","Zimmer dieser Kategorie.","Eine Zeile je Typologie mit unterschiedlichen Zeiten."),"hot:cat-occ":K("Occupazione media della categoria.","Le suite hanno spesso occupazione pi\xF9 bassa delle standard.","Mittlere Auslastung der Kategorie.","Suiten haben oft eine niedrigere Auslastung als Standardzimmer."),"hot:cat-los":K("Notti medie di soggiorno.","Decide il rapporto tra partenze (cambio completo) e fermate.","Mittlere Aufenthaltsn\xE4chte.","Bestimmt das Verh\xE4ltnis von Abreisen (Komplettwechsel) zu Bleiben."),"hot:cat-pax":K("Ospiti medi per camera occupata.","Serve al costo della biancheria.","G\xE4ste je belegtes Zimmer im Mittel.","F\xFCr die W\xE4schekosten."),"hot:cat-balcony":K("Balcone esposto ad aghi, neve, vetri sporchi.","Aggiunge minuti a ogni partenza secondo le regole.","Balkon, der Nadeln, Schnee und schmutzigen Scheiben ausgesetzt ist.","F\xFCgt jeder Abreise Minuten nach den Regeln hinzu."),"hot:cat-bath":K("Minuti di sanificazione del bagno alla partenza.","Dal riferimento della tipologia; sostituisci con il cronometrato.","Minuten f\xFCr die Baddesinfektion bei Abreise.","Aus der Referenz der Typologie; durch den gestoppten Wert ersetzen."),"hot:cat-beds":K("Minuti per letti e biancheria alla partenza.","Con piumino a sacco il tempo cala del 30 %.","Minuten f\xFCr Betten und W\xE4sche bei Abreise.","Mit Duvet und Bezug sinkt die Zeit um 30 %."),"hot:cat-surf":K("Minuti per superfici e pavimenti alla partenza.","Le finiture a prova di pulizia agiscono qui.","Minuten f\xFCr Fl\xE4chen und B\xF6den bei Abreise.","Hier wirken die reinigungsfreundlichen Ausbauten."),"hot:cat-stay":K("Minuti della fermata, se cronometrati.","Vuoto = calcolati dalla percentuale globale.","Minuten der Bleibe, wenn gestoppt.","Leer = aus dem globalen Prozentsatz berechnet."),"hot:rules":K("Minuti che ogni variabile aggiunge o toglie.","Valori dal metodo: cronometra prima di modificarli.","Minuten, die jede Variable hinzuf\xFCgt oder wegnimmt.","Werte aus der Methode: erst stoppen, dann \xE4ndern."),"hot:capex":K("
